<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1584px;
    height: 396px;
    overflow: hidden;
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
  }

  .banner {
    width: 1584px;
    height: 396px;
    position: relative;
    background: #030712;
    overflow: hidden;
  }

  /* Base gradient — deep night with subtle warmth */
  .bg-base {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 80% at 85% 40%, rgba(14, 165, 233, 0.12) 0%, transparent 55%),
      radial-gradient(ellipse 60% 70% at 50% 100%, rgba(59, 130, 246, 0.08) 0%, transparent 60%),
      radial-gradient(ellipse 40% 50% at 20% 20%, rgba(99, 102, 241, 0.06) 0%, transparent 55%),
      linear-gradient(135deg, #030712 0%, #061226 45%, #020617 100%);
  }

  /* Circuit traces */
  .circuits {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0.5;
  }

  /* Glowing dots scattered */
  .dots {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .dot {
    position: absolute;
    border-radius: 50%;
    background: #38bdf8;
    box-shadow: 0 0 10px #38bdf8, 0 0 20px rgba(56, 189, 248, 0.5);
  }

  /* Safe zone for profile picture (bottom-left ~280px) kept clear */

  /* LEFT SIDE: Code terminal block */
  .terminal {
    position: absolute;
    left: 330px;
    top: 50%;
    transform: translateY(-50%);
    width: 320px;
    background: rgba(2, 6, 23, 0.75);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(56, 189, 248, 0.22);
    border-radius: 10px;
    padding: 14px 16px;
    font-family: 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
    box-shadow:
      0 10px 40px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.05),
      0 0 30px rgba(56, 189, 248, 0.08);
  }

  .terminal-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding-bottom: 10px;
    margin-bottom: 10px;
    border-bottom: 1px solid rgba(56, 189, 248, 0.12);
  }

  .terminal-dot {
    width: 10px; height: 10px; border-radius: 50%;
  }
  .td-red { background: #ef4444; }
  .td-yellow { background: #eab308; }
  .td-green { background: #22c55e; }

  .terminal-title {
    margin-left: 10px;
    color: rgba(148, 163, 184, 0.6);
    font-size: 10px;
    letter-spacing: 0.05em;
  }

  .code {
    font-size: 11.5px;
    line-height: 1.65;
    color: #e2e8f0;
  }
  .c-keyword { color: #c084fc; }
  .c-func    { color: #38bdf8; }
  .c-string  { color: #86efac; }
  .c-comment { color: rgba(100, 116, 139, 0.75); font-style: italic; }
  .c-var     { color: #fcd34d; }
  .c-punct   { color: #94a3b8; }

  /* CENTER/RIGHT: Name + title */
  .identity {
    position: absolute;
    right: 80px;
    top: 50%;
    transform: translateY(-50%);
    text-align: right;
  }

  .role-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    background: rgba(56, 189, 248, 0.08);
    border: 1px solid rgba(56, 189, 248, 0.3);
    border-radius: 100px;
    color: #7dd3fc;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 16px;
    box-shadow: 0 0 18px rgba(56, 189, 248, 0.1);
  }

  .role-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #38bdf8;
    box-shadow: 0 0 8px #38bdf8;
  }

  .name {
    font-family: 'Playfair Display', 'Georgia', serif;
    font-size: 74px;
    font-weight: 700;
    line-height: 1;
    color: #ffffff;
    letter-spacing: -2px;
    margin-bottom: 18px;
    text-shadow:
      0 0 40px rgba(56, 189, 248, 0.25),
      0 4px 30px rgba(0,0,0,0.6);
  }

  .name .accent {
    background: linear-gradient(90deg, #38bdf8 0%, #818cf8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    font-size: 17px;
    font-weight: 500;
    color: rgba(226, 232, 240, 0.85);
    letter-spacing: 0.01em;
    margin-bottom: 14px;
  }

  .subtitle .sep {
    color: rgba(56, 189, 248, 0.6);
    margin: 0 10px;
    font-weight: 400;
  }

  /* Tech stack row */
  .stack {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  .tech {
    padding: 5px 12px;
    background: rgba(30, 41, 59, 0.5);
    border: 1px solid rgba(71, 85, 105, 0.5);
    border-radius: 6px;
    font-family: 'JetBrains Mono', 'Consolas', monospace;
    font-size: 11px;
    font-weight: 500;
    color: rgba(203, 213, 225, 0.9);
    letter-spacing: 0.02em;
    backdrop-filter: blur(6px);
  }

  .tech.highlight {
    border-color: rgba(56, 189, 248, 0.4);
    color: #7dd3fc;
    background: rgba(56, 189, 248, 0.08);
  }

  /* Accent neon lines */
  .accent-line-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(56, 189, 248, 0.5) 30%,
      rgba(129, 140, 248, 0.6) 60%,
      transparent 100%);
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
  }

  .accent-line-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg,
      transparent 10%,
      rgba(56, 189, 248, 0.4) 50%,
      transparent 90%);
  }

  /* Jordan location badge - top right corner */
  .location-badge {
    position: absolute;
    top: 24px;
    right: 80px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: rgba(2, 6, 23, 0.6);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(100, 116, 139, 0.3);
    border-radius: 100px;
    font-size: 11px;
    color: rgba(203, 213, 225, 0.8);
    letter-spacing: 0.05em;
  }

  .location-pin {
    width: 12px; height: 12px;
    color: #38bdf8;
  }

  /* Waveform / signature data line */
  .waveform {
    position: absolute;
    bottom: 30px;
    left: 330px;
    right: 80px;
    height: 40px;
    opacity: 0.4;
  }
</style>
</head>
<body>
<div class="banner">
  <div class="bg-base"></div>

  <!-- Circuit traces SVG -->
  <svg class="circuits" viewBox="0 0 1584 396" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <g stroke="#38bdf8" stroke-width="1" fill="none" opacity="0.35">
      <!-- Horizontal traces -->
      <path d="M0 60 L180 60 L200 80 L360 80"/>
      <path d="M0 120 L120 120 L140 140 L280 140 L300 120 L450 120"/>
      <path d="M0 220 L90 220 L110 200 L240 200"/>
      <path d="M0 300 L200 300 L220 320 L340 320"/>
      <path d="M0 360 L150 360 L170 340 L260 340"/>

      <!-- Vertical + diagonal -->
      <path d="M900 0 L900 50 L920 70 L920 180"/>
      <path d="M1100 0 L1100 80 L1080 100 L1080 200"/>
      <path d="M1300 30 L1300 140 L1320 160 L1420 160"/>
      <path d="M1500 0 L1500 80 L1520 100 L1584 100"/>

      <!-- Right side circuit mesh -->
      <path d="M1200 300 L1300 300 L1320 320 L1420 320 L1440 340 L1584 340"/>
      <path d="M1150 380 L1250 380 L1270 360 L1400 360"/>
      <path d="M1380 250 L1460 250 L1480 230 L1584 230"/>

      <!-- Curves / traces upper right -->
      <path d="M1350 50 L1450 50 L1470 70 L1584 70"/>
      <path d="M950 250 L1050 250 L1070 270 L1180 270"/>
    </g>

    <!-- Connection points (circles on traces) -->
    <g fill="#38bdf8">
      <circle cx="200" cy="80" r="3" opacity="0.7"/>
      <circle cx="140" cy="140" r="3" opacity="0.6"/>
      <circle cx="300" cy="120" r="3" opacity="0.7"/>
      <circle cx="110" cy="200" r="3" opacity="0.6"/>
      <circle cx="220" cy="320" r="3" opacity="0.6"/>
      <circle cx="170" cy="340" r="3" opacity="0.5"/>
      <circle cx="900" cy="50" r="4" opacity="0.8"/>
      <circle cx="920" cy="70" r="3" opacity="0.7"/>
      <circle cx="1100" cy="80" r="4" opacity="0.8"/>
      <circle cx="1080" cy="100" r="3" opacity="0.7"/>
      <circle cx="1300" cy="140" r="3" opacity="0.7"/>
      <circle cx="1320" cy="160" r="3" opacity="0.6"/>
      <circle cx="1500" cy="80" r="3" opacity="0.7"/>
      <circle cx="1320" cy="320" r="3" opacity="0.6"/>
      <circle cx="1440" cy="340" r="3" opacity="0.5"/>
      <circle cx="1270" cy="360" r="3" opacity="0.6"/>
      <circle cx="1480" cy="230" r="3" opacity="0.7"/>
      <circle cx="1470" cy="70" r="3" opacity="0.6"/>
      <circle cx="1070" cy="270" r="3" opacity="0.6"/>
    </g>
  </svg>

  <!-- Glowing accent dots -->
  <div class="dots">
    <div class="dot" style="width: 6px; height: 6px; top: 70px; left: 880px;"></div>
    <div class="dot" style="width: 4px; height: 4px; top: 150px; left: 1140px;"></div>
    <div class="dot" style="width: 8px; height: 8px; top: 200px; left: 1480px; background: #818cf8; box-shadow: 0 0 12px #818cf8, 0 0 24px rgba(129,140,248,0.5);"></div>
    <div class="dot" style="width: 5px; height: 5px; top: 280px; left: 940px;"></div>
    <div class="dot" style="width: 4px; height: 4px; top: 340px; left: 1500px;"></div>
    <div class="dot" style="width: 3px; height: 3px; top: 50px; left: 1380px;"></div>
    <div class="dot" style="width: 6px; height: 6px; top: 260px; left: 1260px; background: #818cf8; box-shadow: 0 0 10px #818cf8;"></div>
    <div class="dot" style="width: 4px; height: 4px; top: 320px; left: 1080px;"></div>
  </div>

  <!-- Location badge -->
  <div class="location-badge">
    <svg class="location-pin" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z"/>
    </svg>
    <span>Irbid, Jordan</span>
  </div>

  <!-- Code terminal (center-left) -->
  <div class="terminal">
    <div class="terminal-header">
      <div class="terminal-dot td-red"></div>
      <div class="terminal-dot td-yellow"></div>
      <div class="terminal-dot td-green"></div>
      <span class="terminal-title">~ /dyaa/about.cpp</span>
    </div>
    <div class="code">
      <span class="c-comment">// Computer Engineer in the making</span><br>
      <span class="c-keyword">class</span> <span class="c-func">Engineer</span> <span class="c-punct">{</span><br>
      <span style="padding-left:14px;"><span class="c-keyword">string</span> <span class="c-var">name</span> <span class="c-punct">=</span> <span class="c-string">"Dyaa"</span><span class="c-punct">;</span></span><br>
      <span style="padding-left:14px;"><span class="c-keyword">string</span> <span class="c-var">focus</span> <span class="c-punct">=</span> <span class="c-string">"systems"</span><span class="c-punct">;</span></span><br>
      <span style="padding-left:14px;"><span class="c-keyword">bool</span> <span class="c-var">building</span> <span class="c-punct">=</span> <span class="c-keyword">true</span><span class="c-punct">;</span></span><br>
      <span class="c-punct">}</span><span class="c-punct">;</span>
    </div>
  </div>

  <!-- Name + identity (right side) -->
  <div class="identity">
    <div class="role-chip">
      <span class="role-dot"></span>
      Computer Engineering
    </div>

    <div class="name">
      Dyaa <span class="accent">Al-Farran</span>
    </div>

    <div class="stack">
      <span class="tech highlight">C++</span>
      <span class="tech">Python</span>
      <span class="tech">Embedded</span>
      <span class="tech">Verilog</span>
      <span class="tech">Linux</span>
    </div>
  </div>

  <!-- Accent lines -->
  <div class="accent-line-top"></div>
  <div class="accent-line-bottom"></div>
</div>
</body>
</html>
